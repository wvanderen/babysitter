id: bugfix
name: Bug Fix Workflow
description: Focused workflow for diagnosing and fixing bugs with validation
intelligence: smart

variables:
  issue_id: ""
  reproduction_steps: ""
  fix_timeout: 15m

stages:
  - id: triage
    type: action
    command: |
      echo "=== Bug Triage ===" && \
      echo "Issue: {{issue_id}}" && \
      echo "Gathering initial information..."
    timeout: 1m
    on_success: reproduce
    on_failure: escalate

  - id: reproduce
    type: agent
    prompt: |
      Attempt to reproduce the bug:
      
      Issue ID: {{issue_id}}
      Reproduction steps: {{reproduction_steps}}
      
      Tasks:
      1. Follow the reproduction steps exactly
      2. Document the exact error or behavior
      3. Identify the affected files and functions
      4. Note any relevant log output or stack traces
      
      If unable to reproduce, document why and suggest gathering more info.
    timeout: 10m
    validation:
      - type: file_exists
        path: /tmp/bugfix-report.md
    on_success: diagnose
    on_failure: gather_more_info

  - id: gather_more_info
    type: action
    command: |
      echo "Could not reproduce bug" && \
      echo "Suggest: Add logging, ask user for more details" && \
      echo "INFO_GATHERED"
    timeout: 30s
    on_success: escalate

  - id: diagnose
    type: agent
    prompt: |
      Analyze the bug and identify root cause:
      
      1. Review the reproduction report
      2. Trace the code path that causes the issue
      3. Identify the specific line or logic causing the bug
      4. Determine the correct behavior
      5. Plan the minimal fix needed
      
      Document findings in /tmp/bugfix-analysis.md
    timeout: 10m
    on_success: fix
    on_failure: escalate

  - id: fix
    type: agent
    prompt: |
      Implement the bug fix:
      
      1. Make minimal, targeted changes
      2. Do not refactor unrelated code
      3. Add a regression test if possible
      4. Ensure the fix doesn't break existing functionality
      
      Document changes made in /tmp/bugfix-changes.md
    timeout: 15m
    validation:
      - type: compile
      - type: tests
    on_success: verify_fix
    on_failure: retry_fix
    max_retries: 2

  - id: retry_fix
    type: decision
    on_success: fix

  - id: verify_fix
    type: action
    command: |
      echo "=== Verifying Fix ===" && \
      echo "Running original reproduction steps..." && \
      echo "Running test suite..." && \
      echo "FIX_VERIFIED"
    timeout: 5m
    validation:
      - type: output_contains
        pattern: "FIX_VERIFIED"
    on_success: complete
    on_failure: escalate

  - id: escalate
    type: action
    command: |
      echo "ESCALATION: Bug fix requires manual intervention" && \
      echo "Reports available:" && \
      ls -la /tmp/bugfix-*.md 2>/dev/null || echo "No reports generated" && \
      exit 1
    on_failure: fail

  - id: fail
    type: action
    command: "echo 'Bug fix workflow failed'"

  - id: complete
    type: action
    command: |
      echo "=== Bug Fix Complete ===" && \
      echo "Issue {{issue_id}} has been resolved" && \
      cat /tmp/bugfix-changes.md 2>/dev/null || echo "No changes log"

transitions:
  - from: triage
    to: reproduce
    condition: success
  - from: reproduce
    to: diagnose
    condition: success
  - from: reproduce
    to: gather_more_info
    condition: failure
  - from: diagnose
    to: fix
    condition: success
  - from: fix
    to: verify_fix
    condition: success
  - from: verify_fix
    to: complete
    condition: success

entry_point: triage
