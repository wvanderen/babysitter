services:
  langgraph:
    build: ./langgraph
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/info"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./data/langgraph:/app/data
    env_file:
      - ./langgraph/.env
    restart: unless-stopped
